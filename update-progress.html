<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Progress - Kabayan Monitor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

<header>
<p class="brand">Update Progress</p>
<h1>SPTLB PT ABC</h1>
<p class="subtitle">Permohonan Restitusi</p>
</header>

<section class="current">
<span>Posisi Saat Ini</span>
<h2>● Penyuluh Pajak</h2>
<p>Progress penyelesaian: 50%</p>
</section>

<h2>Pindahkan Berkas Ke</h2>

<section class="workflow">

<button>
<div class="icon">1</div>
<div>
<strong>Pelaksana</strong>
<p>Tahap awal pekerjaan</p>
</div>
</button>

<button>
<div class="icon">2</div>
<div>
<strong>Disposisi Kasi Pelayanan</strong>
<p>Verifikasi dan disposisi</p>
</div>
</button>

<button class="active">
<div class="icon">3</div>
<div>
<strong>Penyuluh Pajak</strong>
<p>Analisis dan penyelesaian</p>
</div>
</button>

<button>
<div class="icon">4</div>
<div>
<strong>Approval Kepala Seksi</strong>
<p>Review dan persetujuan</p>
</div>
</button>

<button>
<div class="icon">5</div>
<div>
<strong>Approval Kepala Kantor</strong>
<p>Persetujuan akhir</p>
</div>
</button>

<button>
<div class="icon">6</div>
<div>
<strong>Arsip (Selesai)</strong>
<p>Berkas selesai</p>
</div>
</button>

</section>

<section class="note">
<h3>Catatan Perubahan</h3>
<textarea placeholder="Tambahkan catatan..."></textarea>
</section>

<button class="save">Simpan Perubahan</button>

</div>

</body>
</html>
