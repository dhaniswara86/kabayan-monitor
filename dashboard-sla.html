
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kabayan Monitor - SLA Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<main class="container">

<h1>Dashboard Kinerja</h1>
<p>Analisis SLA dan penyelesaian berkas</p>

<section class="summary">

<div class="card">
<h3>Rata-rata Penyelesaian</h3>
<strong id="rataHari">0 hari</strong>
</div>

<div class="card">
<h3>Selesai Bulan Ini</h3>
<strong id="selesaiBulan">0</strong>
</div>

<div class="card">
<h3>Lewat SLA</h3>
<strong id="lewatSLA">0</strong>
</div>

</section>

<h2>Berkas Terlama</h2>
<div id="terlama"></div>

<h2>Kinerja Posisi</h2>
<div id="kinerja"></div>

<h2>Tren Penyelesaian</h2>
<canvas id="trendChart"></canvas>

</main>

<script src="js/supabase.js"></script>
<script src="js/dashboard-sla.js"></script>

</body>
</html>
