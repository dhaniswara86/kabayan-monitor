<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Kabayan Monitor Dashboard</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div class="app">

<header class="topbar">

<div>
<p class="brand">Kabayan Monitor</p>
<h1>Dashboard</h1>
<p class="subtitle" id="welcome">
Monitoring penyelesaian berkas
</p>
</div>

<button class="profile">
Admin
</button>

</header>


<section class="hero-card">

<div>
<span>Ringkasan Hari Ini</span>
<h2>Kontrol penyelesaian berkas secara real time</h2>
</div>

</section>


<section class="summary">

<div class="box">
<span>Total Berkas</span>
<strong id="total">0</strong>
</div>

<div class="box">
<span>Selesai</span>
<strong id="selesai">0</strong>
</div>

<div class="box">
<span>Dalam Proses</span>
<strong id="proses">0</strong>
</div>

</section>


<section>

<div class="section-title">
<h2>Workflow</h2>
</div>

<div id="posisi"></div>

</section>


<section>

<div class="section-title">
<h2>Perhatian</h2>
</div>

<div id="deadline"></div>

</section>


<section>

<div class="section-title">
<h2>Berkas Terbaru</h2>
</div>

<div id="daftar-berkas"></div>

</section>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-check.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
