<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Kabayan Monitor Dashboard</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div class="app">

<header class="header">

<p class="brand">Kabayan Monitor</p>

<h1>Dashboard</h1>

<p class="subtitle">
<span id="welcome">Monitoring penyelesaian berkas</span>
</p>

</header>


<div class="summary">

<div class="box">
<span>Total Berkas</span>
<strong id="total">0</strong>
</div>

<div class="box">
<span>Selesai</span>
<strong id="selesai">0</strong>
</div>

<div class="box">
<span>Dalam Proses</span>
<strong id="proses">0</strong>
</div>

</div>


<h2>Distribusi Workflow</h2>
<div id="posisi"></div>


<h2>Deadline</h2>
<div id="deadline"></div>


<h2>Berkas Terbaru</h2>
<div id="daftar-berkas"></div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-check.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
