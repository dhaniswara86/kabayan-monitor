<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Kabayan Monitor</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="app">
<header>
<button class="circle-btn">←</button>
<img src="assets/logo-asd.svg" class="logo">
<button class="circle-btn">⚙</button>
</header>

<section class="title">
<h1>Kabayan Monitor</h1>
<p>Workflow Overview</p>
</section>

<section class="chart">
<div class="donut">
<div>
<strong id="progress">0%</strong>
<span>Berkas Selesai</span>
</div>
</div>
</section>

<section class="summary">
<strong id="total">0 Berkas</strong>
<span>Bulan ini</span>
</section>

<section>
<div id="workflow-list"></div>
</section>

<section class="activity">
<h2>Aktivitas Terbaru</h2>
<div id="activity-list"></div>
</section>
</div>

<script src="js/supabase.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
