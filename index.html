<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabayan Monitor Berkas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<header>
<h1>Kabayan Monitor</h1>
<p>Monitoring Penyelesaian Berkas</p>
</header>

<section class="card welcome">
<h2>Selamat Datang, Faris</h2>
<div class="stats">
<div><b>12</b><span>Berkas Aktif</span></div>
<div class="green"><b>8</b><span>Aman</span></div>
<div class="yellow"><b>3</b><span>Mendekati</span></div>
<div class="red"><b>1</b><span>Terlambat</span></div>
</div>
</section>

<section class="card">
<h2>Deadline Terdekat</h2>
<div class="task">
<h3>SP2DK PT ABC</h3>
<p>Jatuh tempo: 2 hari lagi</p>
<div class="progress"><span></span></div>
<p class="status yellow-text">Segera Diselesaikan</p>
</div>
</section>

<section class="card">
<h2>Tambah Berkas</h2>
<input placeholder="Nomor Berkas">
<input placeholder="Jenis Berkas">
<input type="date">
<input type="date">
<button>Simpan Berkas</button>
</section>

</div>
<script src="js/app.js"></script>
</body>
</html>
