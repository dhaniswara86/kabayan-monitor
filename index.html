<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabayan Monitor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="phone">

<section class="hero">
<div class="top">
<div>
<p>Selamat pagi</p>
<h1>Faris 👋</h1>
</div>
<div class="avatar">ASD</div>
</div>

<div class="date">
Kamis, 27 Agustus 2026
</div>

<div class="progress-card">
<div class="circle">
<div>
<strong>78%</strong>
<span>Selesai</span>
</div>
</div>

<div class="progress-text">
<p>Progress Minggu Ini</p>
<h2>12 Berkas</h2>
<span>9 selesai tepat waktu</span>
</div>
</div>

</section>


<section class="content">

<h2>Yang perlu diperhatikan</h2>

<div class="task-card">
<div>
<span class="tag">Deadline Dekat</span>
<h3>SP2DK PT ABC</h3>
<p>Penyelesaian penelitian</p>
</div>

<div class="days">
<strong>2</strong>
<span>Hari</span>
</div>
</div>


<h2>Status Berkas</h2>

<div class="status-grid">
<div>
<span>🟢</span>
<strong>8</strong>
<p>Aman</p>
</div>

<div>
<span>🟡</span>
<strong>3</strong>
<p>Perhatian</p>
</div>

<div>
<span>🔴</span>
<strong>1</strong>
<p>Kritis</p>
</div>
</div>


<div class="action">
<button>+ Tambah Berkas</button>
</div>

</section>


<nav>
<div>⌂<small>Home</small></div>
<div>▣<small>Berkas</small></div>
<div class="plus">＋</div>
<div>🔔<small>Alert</small></div>
<div>◎<small>Profil</small></div>
</nav>

</div>

<script src="js/app.js"></script>
</body>
</html>
