<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kabayan Monitor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

<header class="header">
    <div>
        <p class="brand">Kabayan Monitor</p>
        <h1>Halo, Faris 👋</h1>
        <p class="date">Kamis, 27 Agustus</p>
    </div>
    <div class="avatar">F</div>
</header>

<section class="progress-widget">
    <div class="ring">
        <div class="ring-center">
            <strong>78%</strong>
            <span>Selesai</span>
        </div>
    </div>

    <div class="progress-info">
        <p>Progress Minggu Ini</p>
        <strong>9 dari 12</strong>
        <span>Berkas selesai</span>
    </div>
</section>

<h2>Prioritas Hari Ini</h2>

<section class="priority-card">
    <div>
        <span class="tag">Deadline Dekat</span>
        <h3>SP2DK PT ABC</h3>
        <p>Penelitian berkas</p>
    </div>

    <div class="deadline">
        <strong>2</strong>
        <span>hari</span>
    </div>
</section>

<h2>Status</h2>

<section class="status-widget">
    <div>
        <strong>8</strong>
        <span>Aman</span>
    </div>
    <div>
        <strong>3</strong>
        <span>Perhatian</span>
    </div>
    <div>
        <strong>1</strong>
        <span>Kritis</span>
    </div>
</section>

<button class="button">+ Tambah Berkas</button>

<nav class="nav">
    <div>⌂<span>Home</span></div>
    <div>□<span>Berkas</span></div>
    <div class="add">+</div>
    <div>🔔<span>Alert</span></div>
    <div>○<span>Profil</span></div>
</nav>

</div>

<script src="js/app.js"></script>
</body>
</html>
