
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kabayan Monitor - Dashboard Pimpinan V2</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<main class="container">

<h1>Dashboard Pimpinan</h1>
<p>Monitoring kinerja penyelesaian berkas</p>


<section class="summary">

<div class="card">
<h3>Total Berkas</h3>
<strong id="total">0</strong>
</div>

<div class="card">
<h3>Selesai</h3>
<strong id="selesai">0</strong>
</div>

<div class="card">
<h3>Proses</h3>
<strong id="proses">0</strong>
</div>

<div class="card">
<h3>Terlambat</h3>
<strong id="terlambat">0</strong>
</div>

</section>


<section class="grid">

<div class="card">
<h2>Beban Tahapan</h2>
<canvas id="chartTahap"></canvas>
</div>


<div class="card">
<h2>Status Berkas</h2>
<canvas id="chartStatus"></canvas>
</div>

</section>



<h2>Berkas Prioritas</h2>

<div id="prioritas"></div>


<h2>Monitoring Per Posisi</h2>

<div id="posisi"></div>


</main>


<script src="js/supabase.js"></script>
<script src="js/pimpinan-dashboard-v2.js"></script>

</body>
</html>
