<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Detail Berkas - Kabayan Monitor</title>
<link rel="stylesheet" href="css/detail.css">
</head>
<body>

<div class="app">

<header>
<button class="back">←</button>
<h1>Detail Berkas</h1>
</header>

<section class="hero">
<h2 id="company">Memuat...</h2>
<p id="case"></p>

<div class="status" id="status">-</div>

<div class="progress-card">
<div class="circle">
<strong id="progress">0%</strong>
</div>
<span>Progress Berkas</span>
</div>
</section>


<section class="card">
<h3>Informasi Berkas</h3>

<div class="row"><span>Jenis Permohonan</span><b id="jenis">-</b></div>
<div class="row"><span>Posisi Saat Ini</span><b id="posisi">-</b></div>
<div class="row"><span>Jatuh Tempo</span><b id="tempo">-</b></div>

</section>


<section class="card">
<h3>Timeline Workflow</h3>
<div id="timeline"></div>
</section>


<section class="card">
<h3>Aktivitas Terakhir</h3>
<div id="activity">-</div>
</section>

</div>

<script src="js/supabase.js"></script>
<script src="js/detail.js"></script>

</body>
</html>
